[project]
name = "bra"
version = "14.0.0"
description = "Battle Ready Armor - AI-orchestrated security assessment framework"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk",
    "httpx>=0.27.0",
    "litellm>=1.40",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "textual>=0.50.0",
    "typer>=0.9.0",
]

[project.scripts]
bra = "bra.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
